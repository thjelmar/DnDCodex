<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local-first web app for D&D session notes and campaign creation." />
    <title>D&D Codex</title>
    <!-- Apply the user's cached theme/accent before first paint to avoid a flash.
         The account value (synced) reconciles once auth loads; see lib/theme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('codex.theme')
          var a = localStorage.getItem('codex.accent')
          var el = document.documentElement
          el.dataset.theme = t === 'light' ? 'light' : 'dark'
          el.dataset.accent = /^(violet|emerald|sky|amber|rose)$/.test(a || '') ? a : 'violet'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.accent = 'violet'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
